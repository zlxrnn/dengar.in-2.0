name: Quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint, types, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install isolated Redis test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y redis-server

      - name: Run unit and integration tests
        run: npm test

      - name: Lint web app
        run: npm run lint

      - name: Lint services and packages
        run: npm run lint:services

      - name: Typecheck web app
        run: npm run typecheck

      - name: Build production web app
        run: npm run build
